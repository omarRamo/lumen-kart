name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: APK (debug) + AAB (release when signing secrets exist)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Booleans only: secret values never reach a step that does not need them.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # Capacitor 8 / AGP 8.13 require JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PlumenKart.versionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-kart-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          test "$(stat -c %s "$RUNNER_TEMP/upload.keystore")" -gt 1024 || { echo '::error::ANDROID_KEYSTORE_BASE64 decodes to < 1 KiB (truncated secret?)'; exit 1; }
      - name: Build signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PlumenKart.versionCode=${{ github.run_number }}
      - name: Verify AAB signature
        if: env.HAS_KEYSTORE == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep -q 'jar verified'
      - name: Remove keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: lumen-kart-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always()
        run: |
          {
            echo '## Lumen Kart — Android'
            echo "- versionCode: ${{ github.run_number }}, versionName: $(node -p "require('./package.json').version")"
            echo '- Debug APK: artifact `lumen-kart-debug-apk-${{ github.run_number }}`'
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo '- Signed AAB: artifact `lumen-kart-release-aab-${{ github.run_number }}` → Play Console, internal testing'
            else
              echo '- No signing secrets: release AAB skipped (set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
