name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Also run the Playwright browser suite (WebGL via SwiftShader)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run store:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-kart-web-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser suite (Playwright)
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.js builds its own online-enabled bundle (.e2e-dist) and starts the relay.
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
